openapi: 3.0.1
info:
  title: Sample Utility API
  description: Sample API set with 5 endpoints for Azure API Management import
  version: '1.0'
servers:
  - url: https://apimops.azure-api.net/utilityapi
paths:
  /health:
    get:
      summary: Health check
      description: Health check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
  /users:
    get:
      summary: Get all users
      description: Get all users
      operationId: getUsers
      responses:
        '200':
          description: List of users
    post:
      summary: Create user
      description: Create user
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
            example:
              id: string
              name: string
              email: string
      responses:
        '201':
          description: User created
  '/users/{userId}':
    get:
      summary: Get user by ID
      description: Get user by ID
      operationId: getUserById
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details
    delete:
      summary: Delete user
      description: Delete user
      operationId: deleteUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User deleted
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
    apiKeyQuery:
      type: apiKey
      name: subscription-key
      in: query
security:
  - apiKeyHeader: [ ]
  - apiKeyQuery: [ ]